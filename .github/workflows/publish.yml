# Publishes @dreamforgestudiollc/emet to npm with trusted publishing (OIDC).
# npmjs is configured for this repository and this workflow filename.
# No npm token is used.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Trusted publishing is bound to the public repository.
    if: github.repository == 'dreamforgestudiollc/EMET'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Node 24 ships npm 11.19, which meets the 11.5.1 trusted-publishing floor.
      # An older npm is raised to a current npm 11 before publish.
      - name: Ensure npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm ${version}"
          NPM_VERSION="${version}" node -e 'const [M,m,p]=process.env.NPM_VERSION.split(".").map(Number); const ok=M>11||(M===11&&(m>5||(m===5&&p>=1))); if(!ok) process.exit(1)' \
            || npm install -g npm@11.21.1
          npm --version

      - name: Guard package version against the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-version-guard.mjs

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
